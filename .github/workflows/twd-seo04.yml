name: TWD SEO-04 RFQ verification
on:
  push:
    branches: [feat/twd-seo-phase-04]
  pull_request:
    paths:
      - "50-Code/site/**"
      - ".github/workflows/twd-seo04.yml"
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 50-Code/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 50-Code/site/package-lock.json
      - name: Install dependency graph
        run: npm install --no-audit --no-fund
      - name: RFQ unit and contract tests
        run: npm run test:rfq
      - name: SEO regression tests and Astro static+server build
        run: npm run build
      - name: Check generated preview policy
        run: |
          ROOT=dist/client; test -f "$ROOT/index.html" || ROOT=dist
          test -f "$ROOT/index.html"
          test -f "$ROOT/rfq/index.html" || test -f "$ROOT/rfq.html" || test -f "$ROOT/rfq/index.htm"
          if grep -RIl "SUPABASE_SERVICE_ROLE_KEY\|RFQ_RATE_SALT\|RESEND_API_KEY" "$ROOT/_astro" --exclude='*.map' 2>/dev/null | grep -q .; then
            echo "Server secret name appeared in public assets"; exit 1
          fi
