name: TWD Lumo redesign verification
on:
  push:
    branches:
      - feat/twd-lumo-interactive-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Astro production build (no deployment)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 50-Code/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Astro
        run: npm run build
      - name: Validate generated pages
        run: |
          test -f dist/index.html
          test -f dist/products/index.html
          test -f dist/rfq/index.html
