name: Twin Disc site validation
on:
  pull_request:
    paths:
      - '50-Code/site/**'
      - '.github/workflows/twin-disc-site-check.yml'
  push:
    branches:
      - 'redesign/performance-polish-2026-10'
    paths:
      - '50-Code/site/**'
      - '.github/workflows/twin-disc-site-check.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 50-Code/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Astro type and content checks
        run: npm run check
      - name: Production build
        run: npm run build
