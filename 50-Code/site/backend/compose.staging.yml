name: twd-rfq-staging
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfq_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: twd_rfq
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?required}
    volumes:
      - twd_rfq_pgdata:/var/lib/postgresql/data
      - ./initdb/01_app_role.sh:/docker-entrypoint-initdb.d/01_app_role.sh:ro
    networks: [rfq_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq_owner -d twd_rfq"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging: {options: {max-size: "10m", max-file: "3"}}
  migrate:
    build: {context: .., dockerfile: backend/Dockerfile}
    restart: "no"
    environment:
      DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE:?required}
    command: ["node","--import","tsx","backend/scripts/migrate.ts"]
    networks: [rfq_internal]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: .., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL_RUNTIME:?required}
      BACKEND_SHARED_TOKEN: ${BACKEND_SHARED_TOKEN:?required}
      RFQ_RATE_SALT: ${RFQ_RATE_SALT:?required}
      UPLOAD_ROOT: /srv/rfq-private
      UPLOAD_QUOTA_BYTES: ${UPLOAD_QUOTA_BYTES:-100000000}
      NOTIFICATION_WORKER: ${NOTIFICATION_WORKER:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes: [twd_rfq_private:/srv/rfq-private]
    ports: ["127.0.0.1:4387:4387"]
    networks: [rfq_internal, rfq_egress]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4387/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    logging: {options: {max-size: "10m", max-file: "3"}}
  backups:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: rfq_owner
      PGDATABASE: twd_rfq
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - twd_rfq_backups:/backups
    networks: [rfq_internal]
    command: ["sh","-c","while :; do sh /scripts/backup.sh; sleep 86400; done"]
    depends_on:
      postgres: {condition: service_healthy}
    logging: {options: {max-size: "10m", max-file: "3"}}
volumes:
  twd_rfq_pgdata:
  twd_rfq_private:
  twd_rfq_backups:
networks:
  rfq_internal: {internal: true}
  rfq_egress: {}
